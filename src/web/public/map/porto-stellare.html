<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Porto Stellare — Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Trirong:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --parchment: #f4e4c1;
    --parchment-dim: #e8d5a3;
    --ink: #5c3a1e;
    --ink-soft: #8b5e3c;
    --gold: #d4a017;
    --gold-bright: #f0c040;
    --teal: #2a4a5e;
    --navy: #0d2137;
    --wood: #1a0f07;
    --display: 'Cinzel', serif;
    --body: 'Crimson Text', 'Trirong', Georgia, serif;
    --thai: 'Trirong', 'Crimson Text', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--wood);
    color: var(--ink);
    font-family: var(--body);
  }

  /* ---- Dark wood table ---- */
  #table {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 120% 100% at 50% 42%, #2c1a0e 0%, #160c05 55%, #0c0602 100%);
  }
  #table::before {
    /* faint wood grain */
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(91deg, rgba(0,0,0,0) 0 38px, rgba(0,0,0,0.12) 38px 40px),
      repeating-linear-gradient(89deg, rgba(120,72,32,0.05) 0 90px, rgba(0,0,0,0.10) 90px 92px);
    opacity: 0.5;
    pointer-events: none;
  }

  /* ---- Map stage ---- */
  #stage {
    position: relative;
    aspect-ratio: 1024 / 522;
    width: min(96vw, calc(94vh * (1024 / 522)));
    box-shadow:
      0 2px 0 rgba(255,230,180,0.06),
      0 24px 60px -10px rgba(0,0,0,0.85),
      0 60px 120px -20px rgba(0,0,0,0.7);
    opacity: 0;
    transform: scale(0.985);
    transition: opacity 1.3s ease, transform 1.6s cubic-bezier(.2,.7,.2,1);
  }
  #stage.in { opacity: 1; transform: scale(1); }

  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* edge vignette for depth */
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow:
      inset 0 0 60px rgba(20,8,0,0.55),
      inset 0 0 160px rgba(20,8,0,0.45);
    background: radial-gradient(ellipse 92% 88% at 50% 48%, transparent 60%, rgba(13,8,3,0.5) 100%);
    z-index: 3;
  }

  /* warm lantern breathing glow over the city band */
  #lantern {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: soft-light;
    background: radial-gradient(ellipse 46% 34% at 42% 40%, rgba(240,192,64,0.55), transparent 70%);
    animation: breathe 7s ease-in-out infinite;
    opacity: 0;
    transition: opacity 1.6s ease 0.6s;
  }
  #stage.in #lantern { opacity: 1; }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  @media (prefers-reduced-motion: reduce) {
    #lantern { animation: none; }
  }

  /* ---- SVG overlay ---- */
  #regions {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    overflow: visible;
  }
  .district {
    fill: transparent;
    stroke: transparent;
    stroke-width: 0.35;
    cursor: pointer;
    outline: none;
    transition: fill 0.45s ease, stroke 0.45s ease, filter 0.45s ease;
  }
  .district:hover,
  .district:focus-visible,
  .district.active,
  .district.highlighted {
    fill: var(--tint);
    stroke: var(--stroke);
    outline: none;
    filter: drop-shadow(0 0 1.4px rgba(240,200,90,0.9));
  }
  .district.active {
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 1.0px rgba(240,200,90,0.7)); }
    50% { filter: drop-shadow(0 0 2.4px rgba(240,200,90,1)); }
  }

  /* District centroid labels */
  .district-label {
    font-family: var(--display);
    font-size: 1.8px;
    font-weight: 600;
    letter-spacing: .04em;
    opacity: 0.42;
    transition: opacity .35s ease, transform .35s ease;
    text-shadow: 0 0 2px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.7);
    transform-box: fill-box;
    transform-origin: center;
    pointer-events: none;
    user-select: none;
  }
  .district-label.bright {
    opacity: 0.92;
    transform: scale(1.18);
  }

  /* Starhill marker */
  #starhill {
    cursor: help;
    outline: none;
  }
  #starhill .star-core {
    fill: var(--gold-bright);
    filter: drop-shadow(0 0 1.6px rgba(240,200,90,0.95));
    animation: twinkle 3.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  #starhill .star-ring {
    fill: none;
    stroke: rgba(240,200,90,0.55);
    stroke-width: 0.25;
    opacity: 0;
    transition: opacity .4s ease;
  }
  #starhill:hover .star-ring { opacity: 1; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.6; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* floating cursor tooltip (starhill) */
  #tip {
    position: fixed;
    z-index: 60;
    max-width: 260px;
    padding: 10px 13px;
    background: linear-gradient(#f7ecd0, #ecdcb4);
    color: var(--ink);
    border: 1px solid var(--gold);
    border-radius: 3px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    font-family: var(--thai);
    font-size: 13.5px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .2s ease, transform .2s ease;
  }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip b { font-family: var(--display); display: block; color: var(--ink-soft); letter-spacing: .04em; margin-bottom: 3px; }

  /* ---------- Journal Info Panel ---------- */
  #panel {
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: 360px;
    max-width: 92vw;
    z-index: 50;
    transform: translateX(106%);
    transition: transform .55s cubic-bezier(.3,.7,.2,1);
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background:
      linear-gradient(180deg, rgba(255,250,235,0.0), rgba(120,80,40,0.10)),
      radial-gradient(120% 60% at 100% 0%, rgba(212,160,23,0.18), transparent 60%),
      linear-gradient(#f6ead0, #ecdcb6);
    border-left: 2px solid rgba(92,58,30,0.55);
    box-shadow: -18px 0 50px -10px rgba(0,0,0,0.6);
  }
  #panel.open { transform: translateX(0); }
  #panel::before {
    /* aged paper speckle + seam shadow at binding */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(120,72,30,0.07) 0 1.5px, transparent 2px),
      radial-gradient(circle at 62% 48%, rgba(120,72,30,0.06) 0 1.5px, transparent 2px),
      radial-gradient(circle at 84% 78%, rgba(120,72,30,0.06) 0 1.5px, transparent 2px),
      radial-gradient(circle at 36% 88%, rgba(120,72,30,0.05) 0 1.5px, transparent 2px);
    background-size: 140px 140px, 200px 200px, 170px 170px, 120px 120px;
    opacity: .7;
    mix-blend-mode: multiply;
  }
  #panel::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 14px;
    background: linear-gradient(90deg, rgba(60,36,14,0.28), transparent);
    pointer-events: none;
  }

  .panel-scroll {
    position: relative;
    z-index: 1;
    overflow-y: auto;
    padding: 30px 30px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-soft) transparent;
    transition: opacity .18s ease;
  }
  .panel-scroll.switching { opacity: 0; }
  .panel-scroll::-webkit-scrollbar { width: 8px; }
  .panel-scroll::-webkit-scrollbar-thumb { background: rgba(139,94,60,0.5); border-radius: 8px; }

  .p-close {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 5;
    width: 34px; height: 34px;
    border: 1px solid rgba(92,58,30,0.5);
    border-radius: 50%;
    background: rgba(255,248,232,0.6);
    color: var(--ink);
    font-family: var(--display);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: background .25s, transform .25s, color .25s;
  }
  .p-close:hover { background: var(--ink); color: var(--parchment); transform: rotate(90deg); }

  .p-eyebrow {
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .p-eyebrow .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 6px var(--accent-glow); }
  .p-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    color: var(--ink);
    text-wrap: balance;
    margin-bottom: 6px;
  }
  .p-alias {
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .p-type {
    display: inline-block;
    font-family: var(--display);
    font-size: 10.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #5c3a1e;
    padding: 5px 11px;
    border: 1px solid rgba(92,58,30,0.45);
    border-radius: 2px;
    background: rgba(212,160,23,0.14);
    margin-bottom: 18px;
  }
  .rule {
    height: 1px;
    border: none;
    background:
      linear-gradient(90deg, transparent, rgba(92,58,30,0.55) 18%, rgba(92,58,30,0.55) 82%, transparent);
    margin: 4px 0 18px;
    position: relative;
  }
  .rule::after {
    content: "✦";
    position: absolute;
    top: -10px; left: 50%; transform: translateX(-50%);
    color: var(--gold);
    font-size: 13px;
    background: linear-gradient(#f6ead0, #ecdcb6);
    padding: 0 8px;
  }
  .p-section-h {
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 22px 0 9px;
  }
  .p-overview {
    font-family: var(--thai);
    font-size: 16px;
    line-height: 1.72;
    color: #4a2f17;
    text-wrap: pretty;
  }
  .p-locations { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .p-locations li {
    position: relative;
    padding-left: 20px;
    font-size: 15.5px;
    line-height: 1.4;
    color: #4a2f17;
  }
  .p-locations li::before {
    content: "❖";
    position: absolute; left: 0; top: 1px;
    color: var(--gold);
    font-size: 11px;
  }
  .p-thumb {
    margin-top: 16px;
    border: 1px solid rgba(92,58,30,0.5);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .p-thumb img { width: 100%; display: block; }
  .p-thumb figcaption {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-soft);
    padding-top: 7px;
  }
  .p-quote {
    position: relative;
    margin-top: 24px;
    padding: 16px 20px 16px 22px;
    font-family: var(--thai);
    font-style: italic;
    font-size: 16.5px;
    line-height: 1.62;
    color: #4a2f17;
    border-left: 3px solid var(--gold);
    background: linear-gradient(90deg, rgba(212,160,23,0.10), transparent);
  }
  .p-quote::before {
    content: "“";
    font-family: var(--display);
    position: absolute; left: 8px; top: 2px;
    font-size: 30px; color: rgba(212,160,23,0.6);
  }
  /* ---------- Detail Modal ---------- */
  #modal {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 4vh 4vw;
    background: rgba(10,6,2,0.78);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .45s ease, visibility .45s;
  }
  #modal.open { opacity: 1; visibility: visible; }
  .modal-card {
    position: relative;
    max-width: 92vw;
    max-height: 92vh;
    transform: scale(0.96);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  #modal.open .modal-card { transform: scale(1); }

  /* cartographic frame */
  .frame {
    position: relative;
    padding: 16px;
    background:
      linear-gradient(135deg, #c79a4a, #8a5e2e 40%, #c79a4a 60%, #6e4a22);
    border-radius: 3px;
    box-shadow:
      0 0 0 2px rgba(40,24,8,0.9),
      0 30px 70px -10px rgba(0,0,0,0.8);
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px solid rgba(40,24,8,0.55);
    pointer-events: none;
    z-index: 4;
  }
  .frame .corner {
    position: absolute;
    width: 26px; height: 26px;
    border: 2px solid rgba(40,24,8,0.8);
    z-index: 5;
  }
  .frame .corner.tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .frame .corner.tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
  .frame .corner.bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
  .frame .corner.br { bottom: 6px; right: 6px; border-left: none; border-top: none; }
  .frame img {
    display: block;
    max-width: 86vw;
    max-height: 78vh;
    width: auto; height: auto;
    border: 1px solid rgba(40,24,8,0.6);
  }
  .modal-cap {
    position: absolute;
    left: 50%; bottom: -2px; transform: translate(-50%, 100%);
    margin-top: 12px;
    text-align: center;
    width: 100%;
    padding-top: 14px;
  }
  .modal-cap .t {
    font-family: var(--display);
    font-size: 17px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--parchment);
  }
  .modal-cap .s {
    font-style: italic;
    font-size: 14px;
    color: rgba(244,228,193,0.7);
    margin-top: 2px;
  }
  .m-close {
    position: absolute;
    top: -14px; right: -14px;
    z-index: 9;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(40,24,8,0.8);
    background: linear-gradient(#f0c040, #c79a4a);
    color: #3a2208;
    font-family: var(--display);
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    transition: transform .25s;
  }
  .m-close:hover { transform: rotate(90deg) scale(1.06); }

  /* Atlas modal nav arrows */
  .m-nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    z-index: 8;
    width: 36px; height: 60px;
    border: none;
    background: rgba(8,4,0,0.55);
    color: rgba(244,228,193,0.6);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s, opacity .2s;
    backdrop-filter: blur(2px);
  }
  .m-nav-prev { left: 0; border-radius: 0 4px 4px 0; }
  .m-nav-next { right: 0; border-radius: 4px 0 0 4px; }
  .m-nav:hover:not(:disabled) { background: rgba(212,160,23,0.22); color: var(--gold-bright); }
  .m-nav:disabled { opacity: 0.18; cursor: default; }

  /* ---------- Home Button ---------- */
  #home-btn {
    position: fixed;
    top: 18px; right: 22px;
    z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: linear-gradient(#f6ead0, #e7d4ac);
    border: 1px solid rgba(92,58,30,0.6);
    border-radius: 3px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(212,160,23,0.14);
    text-decoration: none;
    transition: color .25s, border-color .25s, box-shadow .25s, transform .2s;
  }
  #home-btn:hover {
    color: var(--ink);
    border-color: var(--gold);
    box-shadow: 0 8px 26px rgba(0,0,0,0.6), 0 0 14px rgba(212,160,23,0.2), inset 0 0 0 2px rgba(212,160,23,0.28);
    transform: translateY(-1px);
  }
  #home-btn svg { width: 13px; height: 13px; flex: none; }

  /* ---------- Music control (continues homepage BGM) ---------- */
  .music-ctrl {
    position: fixed;
    top: 62px; right: 22px;
    z-index: 40;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 12px;
    background: linear-gradient(#f6ead0, #e7d4ac);
    border: 1px solid rgba(92,58,30,0.6);
    border-radius: 3px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(212,160,23,0.14);
    transition: border-color .25s, box-shadow .25s;
  }
  .music-ctrl:hover {
    border-color: var(--gold);
    box-shadow: 0 8px 26px rgba(0,0,0,0.6), 0 0 14px rgba(212,160,23,0.2), inset 0 0 0 2px rgba(212,160,23,0.28);
  }
  .music-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); padding: 0; display: flex; align-items: center;
    transition: color .2s, transform .15s;
  }
  .music-btn:hover { color: var(--ink); transform: scale(1.12); }
  .music-btn svg { width: 14px; height: 14px; }
  .music-vol {
    -webkit-appearance: none; appearance: none;
    width: 64px; height: 2px;
    background: linear-gradient(to right, #8a5e22 var(--fill,30%), rgba(92,58,30,0.3) var(--fill,30%));
    outline: none; cursor: pointer; border-radius: 2px;
  }
  .music-vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
    background: #8a5e22; cursor: pointer; box-shadow: 0 0 5px rgba(92,58,30,0.5);
  }
  .music-vol::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: #8a5e22; cursor: pointer; border: none;
  }
  .music-ctrl.pending .music-btn { animation: music-pulse 1.8s ease-in-out infinite; }
  @keyframes music-pulse {
    0%,100% { color: var(--ink-soft); }
    50% { color: #8a5e22; filter: drop-shadow(0 0 5px rgba(212,160,23,0.8)); }
  }

  /* ---------- Legend ---------- */
  #legend {
    position: fixed;
    left: 22px; bottom: 22px;
    z-index: 40;
    width: 244px;
    color: var(--ink);
    background: linear-gradient(#f6ead0, #e7d4ac);
    border: 1px solid rgba(92,58,30,0.6);
    border-radius: 3px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 0 0 3px rgba(212,160,23,0.18);
    overflow: hidden;
    transition: transform .4s ease;
  }
  #legend .leg-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(92,58,30,0.35);
    background: linear-gradient(180deg, rgba(212,160,23,0.16), transparent);
  }
  #legend .leg-head h3 {
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }
  #legend .leg-toggle {
    font-family: var(--display);
    font-size: 14px;
    color: var(--ink-soft);
    transition: transform .35s ease;
  }
  #legend.collapsed .leg-toggle { transform: rotate(-90deg); }
  #legend .leg-body {
    max-height: 340px;
    overflow: hidden;
    transition: max-height .4s ease, opacity .3s ease, padding .4s ease;
    padding: 8px 8px 10px;
  }
  #legend.collapsed .leg-body { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
  .leg-replay-btn {
    display: block; width: 100%; margin-top: 8px;
    font-family: var(--display); font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(244,228,193,0.3); background: none; border: none; cursor: pointer;
    padding: 6px 8px; text-align: left; transition: color .2s;
  }
  .leg-replay-btn:hover { color: rgba(244,228,193,0.65); }
  .leg-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14.5px;
    color: #4a2f17;
    transition: background .2s, color .2s;
  }
  .leg-item:hover, .leg-item.active {
    background: rgba(92,58,30,0.12);
    color: var(--ink);
  }
  .leg-item .ldot {
    width: 12px; height: 12px; border-radius: 50%;
    flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 0 7px var(--accent-glow);
  }

  /* hint */
  #hint {
    position: fixed;
    top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 35;
    font-family: var(--display);
    font-size: 11.5px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(244,228,193,0.62);
    background: rgba(20,10,2,0.5);
    border: 1px solid rgba(212,160,23,0.3);
    padding: 8px 18px;
    border-radius: 30px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease;
  }
  #hint.show { opacity: 1; }
  #hint.fade { opacity: 0; }

  /* ---- Quote placeholder card (districts without a detail map) ---- */
  .quote-card { background: none; }
  .qc-frame {
    position: relative;
    width: min(88vw, 620px);
    padding: clamp(44px, 6vw, 76px) clamp(30px, 5vw, 64px);
    text-align: center;
    background:
      radial-gradient(ellipse 78% 68% at 50% 28%, rgba(212,160,23,0.12), transparent 70%),
      linear-gradient(160deg, #1c110a, #120a04);
    border-radius: 3px;
    box-shadow: 0 0 0 2px rgba(40,24,8,0.9), 0 0 0 4px rgba(212,160,23,0.18), 0 34px 80px -12px rgba(0,0,0,0.85);
  }
  .qc-frame::before {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(212,160,23,0.42);
    pointer-events: none;
  }
  .qc-corner {
    position: absolute; width: 24px; height: 24px;
    border: 2px solid rgba(212,160,23,0.7);
    z-index: 2;
  }
  .qc-corner.tl { top: 5px; left: 5px; border-right: none; border-bottom: none; }
  .qc-corner.tr { top: 5px; right: 5px; border-left: none; border-bottom: none; }
  .qc-corner.bl { bottom: 5px; left: 5px; border-right: none; border-top: none; }
  .qc-corner.br { bottom: 5px; right: 5px; border-left: none; border-top: none; }
  .qc-rose {
    width: 52px; height: 52px; margin: 0 auto 26px;
    position: relative; opacity: .85;
    animation: roseSpin 60s linear infinite;
  }
  .qc-rose::before, .qc-rose::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold) 60%, #9c7414);
  }
  .qc-rose::before { clip-path: polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%); }
  .qc-rose::after { clip-path: polygon(50% 12%,53% 47%,88% 50%,53% 53%,50% 88%,47% 53%,12% 50%,47% 47%); transform: rotate(45deg); opacity: .55; }
  @keyframes roseSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .qc-rose { animation: none; } }
  .qc-eyebrow {
    font-family: var(--display);
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  .qc-eyebrow .qc-type { display:block; color: rgba(244,228,193,0.5); letter-spacing:.18em; font-size:10.5px; margin-top:6px; }
  .qc-quote {
    font-family: 'Cinzel', 'Trirong', serif;
    font-weight: 500;
    font-size: clamp(21px, 3.1vw, 33px);
    line-height: 1.5;
    color: var(--parchment);
    text-wrap: balance;
    position: relative;
    margin: 26px 0 8px;
  }
  .qc-quote::before, .qc-quote::after { content:""; }
  .qc-rule {
    height: 1px; width: 60%; margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.7) 22%, rgba(212,160,23,0.7) 78%, transparent);
    position: relative;
  }
  .qc-rule::after {
    content: "\2726"; position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
    color: var(--gold-bright); font-size: 13px; background: #16100a; padding: 0 9px;
  }
  .qc-sub { margin-top: 16px; font-style: italic; font-size: 14px; color: rgba(244,228,193,0.55); }

  /* intro veil */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(ellipse at 50% 45%, #1c1006, #0a0502);
    display: grid; place-items: center;
    transition: opacity 1.1s ease;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  .veil-inner { text-align: center; padding: 0 6vw; }
  .veil-title {
    font-family: var(--display);
    font-weight: 700;
    color: var(--gold-bright);
    font-size: clamp(34px, 7.4vw, 96px);
    letter-spacing: .06em;
    line-height: 1;
    display: flex; flex-wrap: wrap; justify-content: center;
    text-shadow: 0 0 28px rgba(212,160,23,0.4);
  }
  .veil-title .ltr {
    display: inline-block;
    opacity: 0;
    transform: translateY(22px) scale(.9);
    animation: letterIn .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .veil-title .space { width: .42em; }
  @keyframes letterIn { to { opacity: 1; transform: none; } }
  .veil-rule {
    height: 2px; width: min(74%, 540px); margin: 26px auto;
    background: linear-gradient(90deg, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
    opacity: 0; position: relative;
    animation: veilFade 1.1s 1.0s forwards;
  }
  .veil-rule::after {
    content: "\2726"; position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    color: var(--gold-bright); font-size: 15px; background: #100a05; padding: 0 12px;
  }
  #veil .motto {
    font-family: var(--thai);
    color: var(--gold-bright);
    font-size: clamp(16px, 2.1vw, 24px);
    opacity: 0; text-align: center;
    animation: veilFade 1.3s 1.25s forwards;
  }
  #veil .motto-en {
    font-family: var(--display);
    color: rgba(244,228,193,0.62);
    font-size: clamp(10px, 1.3vw, 14px);
    letter-spacing: .28em; text-transform: uppercase;
    margin-top: 12px; opacity: 0; text-align: center;
    animation: veilFade 1.3s 1.5s forwards;
  }
  @keyframes veilFade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce){
    .veil-title .ltr, .veil-rule, #veil .motto, #veil .motto-en { animation-duration: .01s; opacity: 1; transform: none; }
  }

  /* ---- Atlas Intro ---- */
  #veil-phase-title {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center; padding: 0 6vw;
    opacity: 1;
    transition: opacity 0.7s ease;
  }
  #veil-phase-title.out { opacity: 0; pointer-events: none; }

  #veil-phase-atlas {
    position: absolute; inset: 0;
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
    overflow: hidden;
  }
  #veil-phase-atlas.in { opacity: 1; pointer-events: auto; }
  #veil-phase-atlas img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
  }
  /* soft vignette so the corner info box stays readable */
  #veil-phase-atlas::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 18% 92%, rgba(8,4,0,0.62), transparent 55%),
      linear-gradient(rgba(8,4,0,0.18), rgba(8,4,0,0.18));
    pointer-events: none;
  }

  .atlas-info {
    position: absolute;
    left: clamp(16px, 4vw, 48px);
    bottom: clamp(16px, 5vh, 48px);
    z-index: 2;
    max-width: min(440px, calc(100vw - 40px));
    padding: 22px 26px 20px;
    background: linear-gradient(160deg, rgba(20,11,3,0.88), rgba(12,6,1,0.92));
    border: 1px solid rgba(212,160,23,0.5);
    box-shadow: 0 0 0 1px rgba(8,4,0,0.85), 0 22px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(212,160,23,0.05);
    backdrop-filter: blur(4px);
  }
  .atlas-info .corner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid rgba(212,160,23,0.75);
  }
  .atlas-info .corner.tl { top: 5px; left: 5px; border-right: none; border-bottom: none; }
  .atlas-info .corner.tr { top: 5px; right: 5px; border-left: none; border-bottom: none; }
  .atlas-info .corner.bl { bottom: 5px; left: 5px; border-right: none; border-top: none; }
  .atlas-info .corner.br { bottom: 5px; right: 5px; border-left: none; border-top: none; }

  .atlas-footer {
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .atlas-kbd {
    font-family: var(--display);
    font-size: 9.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(244,228,193,0.25);
  }
  .atlas-kbd kbd {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid rgba(244,228,193,0.18);
    border-radius: 2px;
    font-family: inherit;
    font-size: inherit;
    margin: 0 2px;
  }
  .atlas-enter-btn {
    font-family: var(--display);
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: #2c1a06;
    padding: 12px 30px; border: none; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow: 0 6px 22px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.22);
    border-radius: 2px;
    transition: transform .2s, box-shadow .2s;
  }
  .atlas-enter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.28);
  }
  .atlas-skip-btn {
    font-family: var(--display);
    font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(244,228,193,0.38);
    background: none; border: none; cursor: pointer;
    padding: 8px; transition: color .2s;
  }
  .atlas-skip-btn:hover { color: rgba(244,228,193,0.75); }

  .atlas-caption-title {
    font-family: var(--display);
    font-size: clamp(18px, 2.2vw, 26px);
    letter-spacing: .08em;
    color: var(--gold-bright);
    text-shadow: 0 0 22px rgba(212,160,23,0.45);
  }
  .atlas-caption-sub {
    font-family: var(--thai);
    font-style: italic;
    font-size: clamp(12px, 1.3vw, 15px);
    color: rgba(244,228,193,0.62);
    margin-top: 7px;
    line-height: 1.6;
  }
  .atlas-info .atlas-kbd { display: block; margin-top: 14px; }

  /* ─── Panel drag handle ─── */
  .panel-handle {
    display: none;
    width: 40px; height: 4px;
    background: rgba(92,58,30,0.38);
    border-radius: 2px;
    margin: 10px auto -4px;
    flex: none;
  }

  /* ─── Tablet ─── */
  @media (max-width: 820px) {
    #legend { width: 190px; left: 12px; bottom: 12px; }
    .p-name { font-size: 24px; }
    .atlas-info { max-width: min(400px, calc(100vw - 36px)); }
  }

  /* ─── Mobile ─── */
  @media (max-width: 640px) {
    /* Panel → bottom sheet */
    #panel {
      top: auto; bottom: 0;
      left: 0; right: 0;
      width: 100%; max-width: 100%;
      height: 80vh;
      height: 80dvh;
      transform: translateY(110%);
      transition: transform .5s cubic-bezier(.3,.7,.2,1);
      border-left: none;
      border-top: 2px solid rgba(92,58,30,0.55);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -16px 50px -8px rgba(0,0,0,0.75);
    }
    #panel.open { transform: translateY(0); }
    #panel::after { display: none; } /* hide desktop left-binding shadow */

    .panel-handle { display: block; }
    .panel-scroll { padding: 16px 20px 40px; }
    .p-close { top: 12px; right: 12px; width: 30px; height: 30px; font-size: 15px; }
    .p-name { font-size: 22px; }
    .p-btns { flex-direction: column; }
    .p-btn-atlas, .p-btn-lore { min-width: unset; }

    /* Home button → icon only on mobile */
    #home-btn .btn-text { display: none; }
    #home-btn { padding: 8px 10px; gap: 0; }
    #home-btn svg { width: 15px; height: 15px; }

    /* Music control */
    .music-ctrl { top: 58px; right: 14px; padding: 5px 9px; }
    .music-vol { width: 48px; }

    /* Legend */
    #legend { width: 175px; left: 10px; bottom: 10px; font-size: 13.5px; }

    /* Hint */
    #hint { font-size: 10px; letter-spacing: .16em; padding: 7px 13px; }

    /* Atlas */
    .atlas-info {
      left: 12px; right: 12px; bottom: 14px;
      max-width: none;
      padding: 16px 18px 14px;
    }
    .atlas-caption-title { font-size: 17px; letter-spacing: .05em; }
    .atlas-caption-sub { font-size: 12px; margin-top: 4px; }
    .atlas-enter-btn { padding: 11px 22px; font-size: 11px; }
    .atlas-footer { gap: 14px; margin-top: 14px; }
    .atlas-kbd { display: none !important; }
  }

  /* ---- Stat Bars ---- */
  .p-stats {
    display: flex; gap: 8px;
    margin-bottom: 6px;
    padding: 10px 12px;
    background: rgba(92,58,30,0.06);
    border-radius: 2px;
  }
  .p-stat { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .p-stat-label {
    font-family: var(--display); font-size: 7px;
    letter-spacing: .2em; text-transform: uppercase;
    color: rgba(92,58,30,0.45);
  }
  .p-stat-pips { display: flex; gap: 2px; }
  .p-pip { flex: 1; height: 3px; border-radius: 1px; background: rgba(92,58,30,0.12); }
  .p-pip.on-w { background: rgba(212,160,23,0.72); }
  .p-pip.on-s { background: rgba(80,140,190,0.72); }
  .p-pip.on-d { background: rgba(190,55,35,0.72); }

  /* ---- NPC Cards ---- */
  .p-npc-card {
    display: flex; flex-direction: column; gap: 3px;
    padding: 10px 13px;
    background: rgba(92,58,30,0.08);
    border-left: 2px solid var(--gold);
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .p-npc-name {
    font-family: var(--display);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .04em;
  }
  .p-npc-role {
    font-family: var(--thai);
    font-size: 14.5px;
    line-height: 1.5;
    color: #4a2f17;
  }
  .p-tension {
    font-family: var(--thai);
    font-size: 15px;
    line-height: 1.65;
    color: #5c2a14;
    padding: 11px 14px;
    background: rgba(180,60,20,0.07);
    border-left: 3px solid rgba(180,60,20,0.5);
    border-radius: 2px;
  }
  .p-hook {
    font-family: var(--thai);
    font-style: italic;
    font-size: 15px;
    line-height: 1.65;
    color: #2e2545;
    padding: 11px 14px;
    background: rgba(80,40,120,0.07);
    border-left: 3px solid rgba(100,60,160,0.4);
    border-radius: 2px;
  }
  .p-btns {
    display: flex; gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .p-btn-atlas {
    flex: 1; min-width: 120px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display);
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--parchment);
    padding: 12px 14px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #6e4a22, #4a2f17);
    box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,220,150,0.25);
    border-radius: 2px;
    transition: transform .2s, box-shadow .2s, background .25s;
  }
  .p-btn-atlas:hover {
    background: linear-gradient(180deg, #8a5e2e, #5c3a1e);
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,220,150,0.35);
  }
  .p-btn-lore {
    flex: 1; min-width: 120px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display);
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink);
    padding: 12px 14px;
    border: 1px solid rgba(92,58,30,0.55);
    background: rgba(255,248,232,0.6);
    border-radius: 2px;
    text-decoration: none;
    transition: transform .2s, background .25s, border-color .25s;
  }
  .p-btn-lore:hover {
    background: rgba(255,248,232,0.9);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div id="table">
    <div id="stage" data-screen-label="Porto Stellare map">
      <img id="map" src="assets/map-main.jpg" alt="Map of Porto Stellare, a coastal fantasy city on Moonlit Bay" />
      <div id="lantern"></div>
      <svg id="regions" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Clickable districts of Porto Stellare"></svg>
    </div>
  </div>

  <a id="home-btn" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
    <span class="btn-text">The Veiled Codex</span>
  </a>

  <audio id="bg-audio" src="/assets/codex-of-stars.mp3" loop preload="auto"></audio>

  <!-- Music control (continues homepage BGM) -->
  <div class="music-ctrl" id="music-ctrl">
    <button class="music-btn" id="music-btn" aria-label="Toggle music">
      <svg id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <svg id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
    <input type="range" class="music-vol" id="music-vol" min="0" max="1" step="0.05" value="0.3" aria-label="Volume">
  </div>

  <div id="hint">Click or tap a district to explore its lore</div>
  <div id="tip" role="tooltip"></div>

  <!-- Info panel -->
  <aside id="panel" aria-hidden="true" aria-label="District details"></aside>

  <!-- Detail modal -->
  <div id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Legend -->
  <div id="legend" class="collapsed">
    <div class="leg-head" id="leg-head" role="button" tabindex="0" aria-expanded="false">
      <h3>Districts</h3>
      <span class="leg-toggle">▾</span>
    </div>
    <div class="leg-body" id="leg-body"></div>
    <button class="leg-replay-btn" id="leg-replay-intro">&#9654; Replay Intro</button>
  </div>

  <!-- Intro veil -->
  <div id="veil">
    <!-- Phase 1: Title -->
    <div id="veil-phase-title">
      <div class="veil-inner">
        <h1 class="veil-title" id="veil-title" aria-label="Porto Stellare"></h1>
        <div class="veil-rule"></div>
        <div class="motto">เมืองที่ท้องทะเลสะท้อนแสงแห่งดวงดาว</div>
        <div class="motto-en">The sea reflects the light of the stars</div>
      </div>
    </div>
    <!-- Phase 2: Atlas -->
    <div id="veil-phase-atlas">
      <img id="atlas-img" src="assets/atlas/atlas-p01.jpg" alt="Porto Stellare — An Atlas of the Republic of Wealth" />
      <div class="atlas-info">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="atlas-caption-title">Porto Stellare</div>
        <div class="atlas-caption-sub">An Atlas of the Republic of Wealth — เมืองที่ท้องทะเลสะท้อนแสงแห่งดวงดาว</div>
        <div class="atlas-footer">
          <button class="atlas-enter-btn" id="atlas-enter">Enter the City &rarr;</button>
          <button class="atlas-skip-btn" id="atlas-skip">Skip</button>
        </div>
        <span class="atlas-kbd" aria-hidden="true"><kbd>Esc</kbd> Enter</span>
      </div>
    </div>
  </div>

<script>
const DISTRICTS = [
  {
    id: "verdant",
    name: "Verdant Terraces",
    aliases: "Verdant · Upper Terraces · The Heights",
    type: "Luxury residential — old nobility",
    color: "#4a7c4e",

const STARHILL_TIP = "<b>Starhill</b>จุดที่สูงที่สุดของเมือง · Observatory · Ancient Tower · Archives — ข่าวลือกล่าวว่า Starhill อาจมีอยู่ก่อนที่เมืองจะถูกสร้าง";

// ---- helpers ----
function centroid(points){
  const pts = points.trim().split(/\s+/).map(p => p.split(",").map(Number));
  let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1];}); return [x/pts.length, y/pts.length];
}
function tintColor(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

const svg = document.getElementById('regions');
const SVGNS = "http://www.w3.org/2000/svg";

// build polygons + centroid labels
DISTRICTS.forEach(d => {
  const poly = document.createElementNS(SVGNS, "polygon");
  poly.setAttribute("points", d.points);
  poly.setAttribute("class", "district");
  poly.setAttribute("role", "button");
  poly.setAttribute("tabindex", "0");
  poly.setAttribute("aria-label", d.name + " district");
  poly.dataset.id = d.id;
  poly.style.setProperty("--tint", tintColor(d.color, 0.30));
  poly.style.setProperty("--stroke", tintColor(d.color, 0.95));
  poly.addEventListener("click", () => openDistrict(d.id));
  poly.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDistrict(d.id); }});
  svg.appendChild(poly);

  // district name label at centroid
  const [cx, cy] = centroid(d.points);
  const label = document.createElementNS(SVGNS, "text");
  label.setAttribute("x", cx);
  label.setAttribute("y", cy);
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("dominant-baseline", "middle");
  label.setAttribute("class", "district-label");
  label.dataset.id = d.id;
  label.textContent = d.name.split(" ")[0];
  label.style.fill = d.color;
  label.setAttribute("pointer-events", "none");
  svg.appendChild(label);

  // brighten label on polygon hover
  poly.addEventListener("mouseenter", () => label.classList.add("bright"));
  poly.addEventListener("mouseleave", () => { if(activeId !== d.id) label.classList.remove("bright"); });
});

const tip = document.getElementById('tip');
function moveTip(e){
  const pad = 16;
  let x = e.clientX + pad, y = e.clientY + pad;
  const w = 270, h = tip.offsetHeight || 90;
  if(x + w > window.innerWidth) x = e.clientX - w - pad;
  if(y + h > window.innerHeight) y = e.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
sh.addEventListener("mouseenter", () => { tip.innerHTML = STARHILL_TIP; tip.classList.add("show"); });
sh.addEventListener("mousemove", moveTip);
sh.addEventListener("mouseleave", () => tip.classList.remove("show"));
sh.addEventListener("focus", () => {
  tip.innerHTML = STARHILL_TIP;
  const b = sh.getBoundingClientRect();
  tip.style.left = (b.right + 8) + "px"; tip.style.top = (b.bottom + 8) + "px";
  tip.classList.add("show");
});
sh.addEventListener("blur", () => tip.classList.remove("show"));
// Touch: tap starhill to toggle tooltip
sh.addEventListener("click", e => {
  if(tip.classList.contains("show")){ tip.classList.remove("show"); return; }
  tip.innerHTML = STARHILL_TIP;
  const b = sh.getBoundingClientRect();
  tip.style.left = Math.min(b.right + 8, window.innerWidth - 280) + "px";
  tip.style.top = Math.max(b.bottom + 8, 8) + "px";
  tip.classList.add("show");
  setTimeout(() => tip.classList.remove("show"), 5000);
});

// ---- Legend ----
const legBody = document.getElementById('leg-body');
DISTRICTS.forEach(d => {
  const item = document.createElement('div');
  item.className = "leg-item";
  item.dataset.id = d.id;
  item.setAttribute("tabindex", "0");
  item.setAttribute("role", "button");
  item.setAttribute("aria-label", d.name + " district");
  item.style.setProperty("--accent-glow", tintColor(d.color, 0.85));
  item.innerHTML = `<span class="ldot" style="background:${d.color}"></span><span class="lname">${d.name}</span>`;
  item.addEventListener("click", () => openDistrict(d.id));
  item.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDistrict(d.id); } });
  item.addEventListener("mouseenter", () => {
    if(activeId === d.id) return;
    svg.querySelectorAll(`.district[data-id="${d.id}"]`).forEach(p => p.classList.add("highlighted"));
    svg.querySelectorAll(`.district-label[data-id="${d.id}"]`).forEach(l => l.classList.add("bright"));
    const rect = item.getBoundingClientRect();
    tip.innerHTML = `<b>${d.name}</b><span style="display:block;font-size:12px;color:#7a3a1a;margin-bottom:2px">⚡ ${d.tension}</span><span style="display:block;font-size:12px;font-style:italic;color:#2e244a">↪ ${d.hook}</span>`;
    const tx = rect.right + 10;
    const ty = Math.min(Math.max(rect.top - 20, 8), window.innerHeight - 140);
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
    tip.classList.add("show");
  });
  item.addEventListener("mouseleave", () => {
    if(activeId === d.id) return;
    svg.querySelectorAll(`.district[data-id="${d.id}"]`).forEach(p => p.classList.remove("highlighted"));
    svg.querySelectorAll(`.district-label[data-id="${d.id}"]`).forEach(l => l.classList.remove("bright"));
    tip.classList.remove("show");
  });
  legBody.appendChild(item);
});
const legend = document.getElementById('legend');
const legHead = document.getElementById('leg-head');
function toggleLegend(){
  legend.classList.toggle("collapsed");
  legHead.setAttribute("aria-expanded", String(!legend.classList.contains("collapsed")));
}
legHead.addEventListener("click", toggleLegend);
legHead.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleLegend(); }});

// ---- Panel ----
const panel = document.getElementById('panel');
let activeId = null;
let _panelOpener = null; // element that triggered openDistrict (for focus restore)
let _switchTimer = null;

function pips(n, cls){ return Array.from({length:5}, (_,i) => `<div class="p-pip${i<n?' '+cls:''}"></div>`).join(""); }
function buildPanel(d){
  const accentGlow = tintColor(d.color, 0.85);
  const locs = d.locations.map(l => `<li>${l}</li>`).join("");
  const thumb = d.atmosphere ? `
    <figure class="p-thumb">
      <img src="${d.atmosphere.img}" alt="${d.atmosphere.cap}" loading="lazy" />
      <figcaption>${d.atmosphere.cap}</figcaption>
    </figure>` : "";
  const npcCards = d.npcs.map(n => `
    <div class="p-npc-card">
      <div class="p-npc-name">${n.name}</div>
      <div class="p-npc-role">${n.role}</div>
    </div>`).join("");
  const statsBar = d.stats ? `
    <div class="p-stats">
      <div class="p-stat"><div class="p-stat-label">Wealth</div><div class="p-stat-pips">${pips(d.stats.w,'on-w')}</div></div>
      <div class="p-stat"><div class="p-stat-label">Safety</div><div class="p-stat-pips">${pips(d.stats.s,'on-s')}</div></div>
      <div class="p-stat"><div class="p-stat-label">Danger</div><div class="p-stat-pips">${pips(d.stats.d,'on-d')}</div></div>
    </div>` : "";
  return `
    <div class="panel-handle" aria-hidden="true"></div>
    <button class="p-close" aria-label="Close panel">✕</button>
    <div class="panel-scroll">
      <div class="p-eyebrow" style="--accent-glow:${accentGlow}"><span class="dot" style="background:${d.color}"></span>District of Porto Stellare</div>
      <h2 class="p-name">${d.name}</h2>
      <div class="p-alias">${d.aliases}</div>
      <div class="p-type">${d.type}</div>
      ${statsBar}
      <hr class="rule" />
      <p class="p-overview">${d.overview}</p>
      ${thumb}
      <div class="p-section-h">Key Locations</div>
      <ul class="p-locations">${locs}</ul>
      <blockquote class="p-quote">${d.quote}</blockquote>
      <div class="p-section-h">Notable Characters</div>
      ${npcCards}
      <div class="p-section-h">Current Situation</div>
      <div class="p-tension">${d.tension}</div>
      <div class="p-section-h">Hook</div>
      <div class="p-hook">${d.hook}</div>
      <div class="p-btns">
        <button class="p-btn-atlas" id="view-atlas-page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
          Atlas p.${d.atlasPage}
        </button>
        <a class="p-btn-lore" href="/lore/porto-stellare#${d.id}">
          Full Lore
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>`;
}

function openDistrict(id){
  const d = DISTRICTS.find(x => x.id === id);
  if(!d) return;
  _panelOpener = document.activeElement;
  const wasOpen = panel.classList.contains("open");
  function _populatePanel(){
    activeId = id;
    panel.innerHTML = buildPanel(d);
    panel.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    history.replaceState(null, "", "#" + id);
    svg.querySelectorAll(".district").forEach(p => { p.classList.remove("highlighted"); p.classList.toggle("active", p.dataset.id === id); });
    svg.querySelectorAll(".district-label").forEach(l => l.classList.toggle("bright", l.dataset.id === id));
    legBody.querySelectorAll(".leg-item").forEach(p => p.classList.toggle("active", p.dataset.id === id));
    const closeBtn = panel.querySelector(".p-close");
    closeBtn.addEventListener("click", closePanel);
    const va = panel.querySelector("#view-atlas-page");
    if(va) va.addEventListener("click", () => openAtlasModal(d.atlasPage));
    if(!wasOpen) setTimeout(() => closeBtn.focus(), 560);
    else setTimeout(() => closeBtn.focus(), 0);
    fadeHint();
  }
  if(wasOpen){
    const existing = panel.querySelector(".panel-scroll");
    if(existing) existing.classList.add("switching");
    clearTimeout(_switchTimer);
    _switchTimer = setTimeout(_populatePanel, 180);
  } else {
    _populatePanel();
  }
}

function closePanel(){
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  activeId = null;
  history.replaceState(null, "", location.pathname);
  svg.querySelectorAll(".district").forEach(p => p.classList.remove("active"));
  svg.querySelectorAll(".district-label").forEach(l => l.classList.remove("bright"));
  legBody.querySelectorAll(".leg-item").forEach(p => p.classList.remove("active"));
  if(_panelOpener && typeof _panelOpener.focus === "function") _panelOpener.focus();
  _panelOpener = null;
}

// ---- Modal ----
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modal-card');
function closeModal(){
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
}
let modalAtlasPage = 0;
const ATLAS_TOTAL = 14;
function openAtlasModal(pageNum){
  modalAtlasPage = pageNum;
  const pad = String(pageNum).padStart(2, '0');
  const cap = ATLAS_CAPTIONS[pageNum - 1];
  modalCard.className = 'modal-card';
  modalCard.innerHTML = `
    <button class="m-close" aria-label="Close">✕</button>
    <div class="frame" id="modal-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <img id="modal-atlas-img" src="assets/atlas/atlas-p${pad}.jpg" alt="Atlas page ${pageNum}" style="opacity:0;transition:opacity .35s" />
      <button class="m-nav m-nav-prev" aria-label="Previous page" ${pageNum <= 1 ? 'disabled' : ''}>&#8592;</button>
      <button class="m-nav m-nav-next" aria-label="Next page" ${pageNum >= ATLAS_TOTAL ? 'disabled' : ''}>&#8594;</button>
    </div>
    <div class="modal-cap"><div class="t">${cap.title}</div><div class="s">${cap.sub}</div></div>`;
  const mImg = modalCard.querySelector('#modal-atlas-img');
  mImg.onload = () => { mImg.style.opacity = '1'; };
  if(mImg.complete) mImg.style.opacity = '1';
  modalCard.querySelector('.m-close').addEventListener('click', closeModal);
  modalCard.querySelector('.m-nav-prev').addEventListener('click', () => openAtlasModal(modalAtlasPage - 1));
  modalCard.querySelector('.m-nav-next').addEventListener('click', () => openAtlasModal(modalAtlasPage + 1));
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
}
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });

// click water / map background closes panel
document.getElementById('map').addEventListener("click", closePanel);

// ---- Intro sequence ----
const veil        = document.getElementById('veil');
const phaseTitle  = document.getElementById('veil-phase-title');
const phaseAtlas  = document.getElementById('veil-phase-atlas');
const stage       = document.getElementById('stage');
const hint        = document.getElementById('hint');
function fadeHint(){ hint.classList.add("fade"); }

// staggered letter reveal of the city title
(function buildTitle(){
  const vt = document.getElementById('veil-title');
  const text = "Porto Stellare";
  [...text].forEach((ch, i) => {
    if(ch === " "){ const s = document.createElement('span'); s.className = "space"; vt.appendChild(s); return; }
    const sp = document.createElement('span');
    sp.className = "ltr";
    sp.textContent = ch;
    sp.style.animationDelay = (0.18 + i * 0.07) + "s";
    vt.appendChild(sp);
  });
})();

// ---- Atlas captions (used by the district atlas modal) ----
const ATLAS_CAPTIONS = [
  { title: "Porto Stellare",                          sub: "An Atlas of the Republic of Wealth" },
  { title: "Contracts Over Crowns",                   sub: "Here, contracts are worth more than crowns. Money remains the true ruler of the city." },
  { title: "The Architecture of Inequality",          sub: "In Porto Stellare, geography is destiny. The literal height of your residence dictates your power, safety, and proximity to the stars." },
  { title: "Cartography of Moonlit Bay",              sub: "Sheer cliffs, a natural harbor, and a peninsula — geography shaped this city, and the city shaped its people." },
  { title: "The Cycle of Capital",                    sub: "The lower districts produce the wealth they are forbidden from owning, while the upper districts consume the wealth they do not produce." },
  { title: "The Upper Districts: Power & Academia",   sub: "Verdant Terraces & White Cliff Ward — isolation and education as instruments of power." },
  { title: "The Central Districts: Commerce & Illusion", sub: "Golden Crescent & Aurora Promenade — the engine and the face." },
  { title: "Silver Steps: The Heartbeat",             sub: "\"If Aurora is the face, Silver Steps is the heart. If you want to go anywhere in Porto Stellare, you pass through here.\"" },
  { title: "Stellamar Port: The Gateway",             sub: "\"Rumors travel faster than ships. In Stellamar, money is always faster than the law.\"" },
  { title: "Iron Quarters: The Engine Room",          sub: "\"We built this city, but we never get to live in it. From Verdant they look down and see smoke; from Iron we look up and see stars.\"" },
  { title: "Old Crown: The Stagnant Anchor",          sub: "\"Everything started here. Everything old enough returns here.\"" },
  { title: "The Hollow Below: The Forgotten Mirror",  sub: "\"Above is Porto Stellare. Below is the truth. Everything the city tries to hide ends up here.\"" },
  { title: "The Atlas Matrix: District Diagnostics",  sub: "A comparative overview of Porto Stellare's eight districts — function, security, demographics, and reputation." },
  { title: "The City of Reflections",                 sub: "\"For travelers, a city of opportunity. For the elite, a city of power. For those below… wealth is always in sight, but never in hand.\"" },
];

function enterCity(){
  try { localStorage.setItem('map:porto-stellare:intro-seen', '1'); localStorage.setItem('map:porto-stellare:visited', Date.now()); } catch(e) {}
  veil.classList.add("gone");
  phaseAtlas.classList.remove("in");
  const hashId = window.location.hash.slice(1);
  if(hashId && DISTRICTS.find(x => x.id === hashId)){
    setTimeout(() => openDistrict(hashId), 650);
  } else {
    setTimeout(() => { hint.classList.add("show"); }, 600);
    setTimeout(() => { if(!activeId) fadeHint(); }, 7000);
  }
}
document.getElementById('atlas-enter').addEventListener('click', enterCity);
document.getElementById('atlas-skip').addEventListener('click', enterCity);
document.getElementById('leg-replay-intro').addEventListener('click', () => {
  try { localStorage.removeItem('map:porto-stellare:intro-seen'); } catch(e) {}
  window.location.reload();
});

// keyboard: arrow keys navigate atlas/modal, Escape skips/closes
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(modal.classList.contains("open")) closeModal();
    else if(panel.classList.contains("open")) closePanel();
    else if(!veil.classList.contains("gone")) enterCity();
  }
  // Atlas modal navigation
  if(modal.classList.contains("open") && modalAtlasPage > 0){
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      if(modalAtlasPage < ATLAS_TOTAL) openAtlasModal(modalAtlasPage + 1);
    }
    if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      if(modalAtlasPage > 1) openAtlasModal(modalAtlasPage - 1);
    }
    return;
  }
});

window.addEventListener("load", () => {
  setTimeout(() => stage.classList.add("in"), 300);
  // Auto-expand legend on desktop
  if(window.innerWidth > 820){
    legend.classList.remove("collapsed");
    legHead.setAttribute("aria-expanded", "true");
  }
  const deepLinkId = window.location.hash.slice(1);
  if(deepLinkId && DISTRICTS.find(x => x.id === deepLinkId)){
    // deep-link: skip veil entirely, open district after stage fades in
    veil.classList.add("gone");
    setTimeout(() => openDistrict(deepLinkId), 700);
  } else {
    let introSeen = false;
    try { introSeen = localStorage.getItem('map:porto-stellare:intro-seen') === '1'; } catch(e) {}
    if(introSeen){
      // returning visitor: skip straight into city
      setTimeout(() => enterCity(), 350);
    } else {
      // first visit: play full intro (title → atlas → enter)
      setTimeout(() => {
        phaseTitle.classList.add("out");
        setTimeout(() => phaseAtlas.classList.add("in"), 400);
      }, 2200);
    }
  }
});

// ─── Touch: swipe panel down to close (mobile bottom-sheet) ───
let panelSwipeY = 0;
panel.addEventListener('touchstart', e => {
  panelSwipeY = e.touches[0].clientY;
}, { passive: true });
panel.addEventListener('touchend', e => {
  if(window.innerWidth > 640) return;
  const dy = e.changedTouches[0].clientY - panelSwipeY;
  if(dy > 90) closePanel();
}, { passive: true });

// ── Music player — continues homepage BGM (shared volume/mute/position) ──
(function(){
  const audio     = document.getElementById('bg-audio');
  const btn       = document.getElementById('music-btn');
  const ctrl      = document.getElementById('music-ctrl');
  const iconSound = document.getElementById('icon-sound');
  const iconMute  = document.getElementById('icon-mute');
  const volSlider = document.getElementById('music-vol');
  if (!audio || !btn) return;

  const POS_KEY = 'bgm:codex:pos';

  function updateSlider(){
    volSlider.style.setProperty('--fill', Math.round(parseFloat(volSlider.value) * 100) + '%');
  }

  try {
    const sv = localStorage.getItem('index-music-vol');
    const sm = localStorage.getItem('index-music-mute');
    if (sv !== null){ audio.volume = parseFloat(sv); volSlider.value = sv; }
    else audio.volume = 0.3;
    if (sm === 'true'){ audio.muted = true; iconSound.style.display = 'none'; iconMute.style.display = ''; }
  } catch(e){ audio.volume = 0.3; }
  updateSlider();

  // Resume from where the previous page left off
  try {
    const ps = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if (ps && isFinite(ps.t) && Date.now() - ps.at < 30 * 60 * 1000){
      const seek = () => { try { audio.currentTime = ps.t; } catch(e){} };
      if (audio.readyState >= 1) seek();
      else audio.addEventListener('loadedmetadata', seek, { once: true });
    }
  } catch(e){}

  // Keep position saved so the next page continues seamlessly
  let lastPosSave = 0;
  function savePos(){
    try { localStorage.setItem(POS_KEY, JSON.stringify({ t: audio.currentTime, at: Date.now() })); } catch(e){}
  }
  audio.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastPosSave < 2000) return;
    lastPosSave = now; savePos();
  });
  window.addEventListener('pagehide', savePos);

  let started = false;
  const triggerEvents = ['click','scroll','touchstart','keydown','mousedown','pointermove'];

  function onPlaying(){
    if (started) return;
    started = true;
    ctrl.classList.remove('pending');
    triggerEvents.forEach(ev => document.removeEventListener(ev, tryStart));
    // gentle fade-in so the hand-off between pages feels continuous
    const target = audio.volume;
    if (target > 0){
      audio.volume = 0;
      let s = 0; const N = 14;
      const iv = setInterval(() => {
        s++;
        audio.volume = Math.min(target, target * s / N);
        if (s >= N) clearInterval(iv);
      }, 30);
    }
  }
  audio.addEventListener('playing', onPlaying);

  function tryStart(){ if (!started) audio.play().catch(()=>{}); }

  audio.play().then(onPlaying).catch(() => {
    ctrl.classList.add('pending');
    triggerEvents.forEach(ev => document.addEventListener(ev, tryStart, { passive: true }));
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !started) tryStart();
  });

  btn.addEventListener('click', function(){
    if (!started){ tryStart(); return; }
    audio.muted = !audio.muted;
    iconSound.style.display = audio.muted ? 'none' : '';
    iconMute.style.display  = audio.muted ? ''     : 'none';
    try { localStorage.setItem('index-music-mute', audio.muted); } catch(e){}
  });

  volSlider.addEventListener('input', function(){
    audio.volume = parseFloat(this.value);
    updateSlider();
    if (!started) tryStart();
    if (audio.muted && audio.volume > 0){
      audio.muted = false;
      iconSound.style.display = ''; iconMute.style.display = 'none';
      try { localStorage.setItem('index-music-mute', false); } catch(e){}
    }
  });
  volSlider.addEventListener('change', function(){
    try { localStorage.setItem('index-music-vol', audio.volume); } catch(e){}
  });

  // M key — toggle mute
  document.addEventListener('keydown', function(e){
    if (e.key !== 'm' && e.key !== 'M') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (document.activeElement || {}).tagName || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    btn.click();
  });

  // Fade out before leaving via internal links (position already saved on pagehide)
  document.addEventListener('click', function(e){
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest('a[href]');
    if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
    const href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#' || a.origin !== location.origin) return;
    if (audio.paused || audio.muted || audio.volume <= 0) return;
    e.preventDefault();
    savePos();
    const dest = a.href, start = audio.volume, steps = 12;
    let step = 0;
    const iv = setInterval(function(){
      step++;
      audio.volume = Math.max(0, start * (1 - step / steps));
      if (step >= steps){ clearInterval(iv); location.href = dest; }
    }, 18);
  });
})();
