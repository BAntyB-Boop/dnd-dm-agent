<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bake Phoenix Particles</title>
<style>
  body{background:#0a0e1c;color:#cfe;font:14px/1.5 system-ui,sans-serif;padding:32px;max-width:760px;margin:0 auto}
  h1{font-family:Georgia,serif;color:#9cf;margin-bottom:4px}
  .sub{color:#789;margin-bottom:24px}
  button{background:#1a3a8c;color:#fff;border:1px solid #4a6ed0;padding:10px 20px;font-size:14px;cursor:pointer;border-radius:4px;margin-right:8px}
  button:hover{background:#2a4aac}
  button:disabled{opacity:0.4;cursor:not-allowed}
  pre{background:#000a14;border:1px solid #1a2a44;padding:12px;border-radius:4px;max-height:360px;overflow:auto;font-size:12px;white-space:pre-wrap}
  .ok{color:#7fe}
  .err{color:#f88}
  .info{color:#fc8}
</style>
</head>
<body>
  <h1>Bake Phoenix Particles → .bin</h1>
  <div class="sub">One-time tool · loads phoenix.glb · samples N points · downloads a binary blob</div>

  <div style="margin:16px 0">
    <label>Particle count:
      <input id="cnt" type="number" value="120000" min="5000" max="500000" step="1000" style="width:120px;padding:4px;background:#001022;color:#cfe;border:1px solid #1a3a6a">
    </label>
    <button id="run">Bake & Download</button>
  </div>

  <pre id="log"></pre>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
const logEl = document.getElementById('log');
const btn   = document.getElementById('run');
const cntEl = document.getElementById('cnt');
function log(msg, cls){
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  try {
    const TOTAL = parseInt(cntEl.value, 10) || 120000;
    log('importing three…');
    const THREE = await import('three');
    const { GLTFLoader }         = await import('three/addons/loaders/GLTFLoader.js');
    const { MeshSurfaceSampler } = await import('three/addons/math/MeshSurfaceSampler.js');

    log('loading /assets/folio/phoenix.glb (20MB, may take a moment)…', 'info');
    const gltf = await new Promise((res, rej) => {
      new GLTFLoader().load('/assets/folio/phoenix.glb', res,
        (xhr) => { if (xhr.lengthComputable) log(`  download ${(xhr.loaded/xhr.total*100).toFixed(0)}%`); },
        rej);
    });

    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const sizeLen = box.getSize(new THREE.Vector3()).length();
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    root.scale.setScalar(3.4 / sizeLen);
    root.updateMatrixWorld(true);

    const meshes = [];
    let totalArea = 0;
    root.traverse(o => {
      if (o.isMesh && o.geometry){
        const bb = new THREE.Box3().setFromObject(o);
        const s = bb.getSize(new THREE.Vector3());
        const a = s.x*s.y + s.y*s.z + s.x*s.z + 0.0001;
        meshes.push({ mesh:o, area:a });
        totalArea += a;
      }
    });
    log(`meshes found: ${meshes.length}`);
    log(`sampling ${TOTAL} points…`);

    const positions = new Float32Array(TOTAL * 3);
    const seeds     = new Float32Array(TOTAL);
    const y01s      = new Float32Array(TOTAL);
    const tmp = new THREE.Vector3();
    let cursor = 0;
    let yMin = Infinity, yMax = -Infinity;

    const t0 = performance.now();
    meshes.forEach((entry, idx) => {
      const sampler = new MeshSurfaceSampler(entry.mesh).build();
      const cnt = (idx === meshes.length - 1) ? (TOTAL - cursor) : Math.floor(TOTAL * entry.area / totalArea);
      for (let i = 0; i < cnt; i++){
        sampler.sample(tmp);
        tmp.applyMatrix4(entry.mesh.matrixWorld);
        positions[cursor*3  ] = tmp.x;
        positions[cursor*3+1] = tmp.y;
        positions[cursor*3+2] = tmp.z;
        if (tmp.y < yMin) yMin = tmp.y;
        if (tmp.y > yMax) yMax = tmp.y;
        seeds[cursor] = Math.random();
        cursor++;
      }
    });
    const yRange = (yMax - yMin) || 1;
    for (let i = 0; i < cursor; i++){
      y01s[i] = (positions[i*3+1] - yMin) / yRange;
    }
    log(`sampled ${cursor} points in ${((performance.now()-t0)/1000).toFixed(2)}s`, 'ok');

    // Binary format:
    //   magic 'PHX1' (4 bytes)
    //   u32 count
    //   f32[count*3] positions
    //   f32[count]   seeds
    //   f32[count]   y01
    const headerBytes = 4 + 4;
    const bodyBytes   = cursor * (3 + 1 + 1) * 4;
    const buf = new ArrayBuffer(headerBytes + bodyBytes);
    const view = new DataView(buf);
    view.setUint8(0, 0x50); view.setUint8(1, 0x48); view.setUint8(2, 0x58); view.setUint8(3, 0x31); // 'PHX1'
    view.setUint32(4, cursor, true);
    new Float32Array(buf, 8, cursor*3).set(positions.subarray(0, cursor*3));
    new Float32Array(buf, 8 + cursor*3*4, cursor).set(seeds.subarray(0, cursor));
    new Float32Array(buf, 8 + cursor*3*4 + cursor*4, cursor).set(y01s.subarray(0, cursor));

    const blob = new Blob([buf], { type:'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'phoenix-particles.bin';
    a.click();
    URL.revokeObjectURL(url);
    log(`downloaded phoenix-particles.bin (${(buf.byteLength/1024/1024).toFixed(2)} MB)`, 'ok');
    log('→ place file at: src/web/public/assets/folio/phoenix-particles.bin', 'info');
  } catch(e){
    console.error(e);
    log('ERROR: ' + (e.message || e), 'err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
